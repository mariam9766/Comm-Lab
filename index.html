<!DOCTYPE html>
<html>

<head>
    <title>Week 2b - HTML</title>
    <style>
        body {
            background-color: #b6cde3;
            color: #325b7d;
            font-size: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            color: red;
            font-size: 1.5em;
        }

        h1 {
            color: rgb(95, 31, 95);
            font-family: 'Courier New', Courier, monospace;
        }

        #tagline {
            color: aquamarine;
        }

        .caption {
            font-style: italic;
        }

        img.logo{
            width: 200px;
        }

        div.contents p{
            background-color: rgba(58, 58, 198, 0.892);
            color: pink;
        }
    </style>
</head>

<body>
    <h1>This is the heading - h1 for heading 1</h1>
    <video controls src="assets/road.mp4"></video>
    <p id="tagline">This is the paragraph</p>
    <p class="caption">This is the 2nd paragraph</p>
    <a target="_blank" href="https://www.nyuadim.com/">I am a link to NYUAD IM Website</a>

    <!-- Trial for Website and this is a commment -->

    <div class="contents">
        <ul>
            <li>List</li>
            <li>Apple</li>
            <li>Microsoft</li>
            <li>Meta</li>
            <li>Amazon</li>
            <li>Alphabet</li>
        </ul>
        <img src="assets/landscape.jpg" alt="Landscape of San Fransisco" class="logo">
        <ol>
            <li>Ordered list</li>
            <li>Item A</li>
            <li>Item B</li>
            <li>Item C</li>
        </ol>
        <p class="caption">This is the followup paragraph</p>
    </div>
</body>

</html>
